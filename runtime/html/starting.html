<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Starting up</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f7f7;color:#1d2327}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px;background:#fff;border:1px solid #dcdcde;border-radius:8px;padding:32px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0;color:#50575e;line-height:1.5}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f0b429;margin-bottom:16px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="dot" aria-hidden="true"></span>
    <h1>Your site is starting up</h1>
    <p>WordPress is being prepared. This page refreshes automatically and the site will appear in a moment.</p>
  </div>
</main>
</body>
</html>
