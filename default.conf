server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;

    # Relative Location headers: TLS terminates upstream, so an absolute redirect would be
    # built on this plain http:// listener and downgrade https visitors.
    absolute_redirect off;

    # While php-fpm is still starting (run.sh keeps this flag until it listens; a first boot copies
    # WordPress core onto the volume first) answer 503 + Retry-After with a "starting up" page rather
    # than connection refused or 502. WordPress's own 503s (maintenance mode) are not intercepted.
    if (-f /var/run/wp-runtime/starting) {
        return 503;
    }
    error_page 503 @starting;
    location @starting {
        root /usr/share/wp-runtime/html;
        more_set_headers "Retry-After: 5";
        more_set_headers "Cache-Control: no-store";
        try_files /starting.html =503;
    }

    # Per-IP connection limit (configurable via RATE_LIMIT_MAX_CONN_PER_IP).
    include /etc/nginx/conf.d/generated_server_overrides.conf;

    # PHP goes to the capped upstream (generated_upstream.conf: max_conns sized to the PHP-FPM
    # pool); the loopback-only locations below switch to the uncapped one. When the cap is reached
    # nginx has "no live upstreams" (502): answer 503 + Retry-After with a holding page instead, so
    # a burst is shed in milliseconds and the capsule recovers the moment it ends. Cache HITs and
    # static files never open an upstream connection and keep being served meanwhile.
    set $php_upstream php_fpm;
    error_page 502 =503 @busy;
    location @busy {
        # Only the capacity cap gets the holding page: nginx then never selected a server, and
        # $upstream_addr carries the upstream group's name instead of an address. A worker that
        # crashed or was killed mid-request (request_terminate_timeout, an OOM kill), an oversized
        # header or FPM being gone leave a real address there and stay a plain 502, so a crash is
        # never reported as load and the page's auto-refresh never re-issues the request behind it.
        if ($upstream_addr != "php_fpm") {
            return 502;
        }
        root /usr/share/wp-runtime/html;
        more_set_headers "Retry-After: 5";
        more_set_headers "Cache-Control: no-store";
        try_files /busy.html =503;
    }

    # FastCGI timeouts (wall clock). Public requests: 120s. The admin PHP location raises them to
    # 300s, which is what WordPress budgets for core/plugin upgrades (set_time_limit(300)); a
    # 0.07-0.25 vCPU pod needs it, and the capacity cap bounds how many such requests exist.
    fastcgi_connect_timeout 10s;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;

    # Security headers. more_set_headers (headers-more module) is additive: unlike add_header,
    # these are kept in every location, including static assets and NGINX_EXTRA_CONF blocks.
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
    more_set_headers "X-Permitted-Cross-Domain-Policies: none";

    # Dynamic security headers: CSP and HSTS (CSP_HEADER, HSTS_HEADER).
    include /etc/nginx/conf.d/generated_security_headers.conf;

    if (!-e $request_filename) {
        rewrite /wp-admin$ $uri/ permanent;
        rewrite ^(/[^/]+)?(/wp-.*) $2 last;
        rewrite ^(/[^/]+)?(/.*\.php) $2 last;
    }

    # Health check endpoint for Kubernetes. Answered by PHP-FPM's ping path, so it fails (502)
    # when FPM is down rather than reporting a pod that can't serve PHP as healthy. Uncapped: it
    # waits for a worker rather than being shed, so a saturated pool shows as a slow probe, not a
    # failed one. Give liveness probes a generous timeout, or use the TCP/startup probes.
    location = /healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/fpm-ping;
        fastcgi_param SCRIPT_NAME     /fpm-ping;
        fastcgi_param REQUEST_URI     /fpm-ping;
        fastcgi_pass php_fpm_internal;
    }

    # Page-cache purge endpoint for the runtime mu-plugin (generated only when the cache is on).
    include /etc/nginx/conf.d/generated_cache_purge.conf;

    # --- Block sensitive files (404: do not confirm they exist) ---

    # wp-config.php and every copy of it (wp-config.php.bak, wp-config.old, wp-config.txt ...).
    location ~* /wp-config\. {
        return 404;
    }

    location ~* /(wp-config-sample\.php|readme\.html|license\.txt|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|\.env|\.git|\.svn) {
        return 404;
    }

    # Dumps, backups, editor leftovers, logs and config files that should never be downloadable.
    location ~* \.(sql|sql\.gz|sql\.zip|bak|old|orig|save|swp|swo|ini|log|sh|conf|dist)$ {
        return 404;
    }

    # WordPress debug log — often contains DB credentials and stack traces.
    location ~* /wp-content/debug\.log {
        return 404;
    }

    # Apache leftover files — not used by nginx but may contain sensitive data.
    location ~* /\.(htaccess|htpasswd|user\.ini) {
        return 404;
    }

    # Plugin/theme readme/changelog files expose exact version numbers to scanners.
    location ~* /wp-content/(plugins|themes)/[^/]+/(readme|changelog|license)\.(txt|html|md)$ {
        return 404;
    }

    # wp-includes PHP files should never be called directly over HTTP.
    location ~* ^/wp-includes/.*\.php$ {
        return 404;
    }

    # Drop-ins (advanced-cache.php, object-cache.php, db.php ...) are included, never requested.
    location ~* ^/wp-content/[^/]+\.php$ {
        return 404;
    }

    # Block PHP execution in writable/upload directories.
    location ~* ^/wp-content/uploads/.*\.php$ {
        return 404;
    }
    location ~* ^/wp-content/cache/.*\.php$ {
        return 404;
    }
    location ~* ^/wp-content/upgrade/.*\.php$ {
        return 404;
    }

    # Block hidden files except ACME challenge.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # --- Static assets ---

    # WordPress serves the Site Icon for /favicon.ico when there is no file.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$args;
    }

    # Long-lived immutable assets (30 days; WordPress versions asset URLs with ?ver=).
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|webp|avif|svg|ico|cur|woff|woff2|ttf|eot|otf|mp4|webm|ogg|ogv|pdf|zip|webmanifest|wasm)$ {
        access_log off;
        log_not_found off;
        more_set_headers "Cache-Control: public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # XML and text files — short cache (sitemaps regenerate frequently; robots.txt must be fresh).
    # Falls through to WordPress for dynamically generated sitemaps.
    location ~* \.(xml|txt)$ {
        access_log off;
        more_set_headers "Cache-Control: public, max-age=3600";
        try_files $uri /index.php?$args;
    }

    # --- Protected WordPress routes ---

    # wp-login: strict rate limit (brute force), always bypass cache.
    location = /wp-login.php {
        limit_req zone=login_routes burst=10 nodelay;
        include /etc/nginx/snippets/wp-fastcgi.conf;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }

    # Comment form: rate-limited like login (spam), never cached.
    location = /wp-comments-post.php {
        limit_req zone=login_routes burst=5 nodelay;
        include /etc/nginx/snippets/wp-fastcgi.conf;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }

    # XML-RPC: blocked by default, enable via XMLRPC_ENABLED=true.
    location = /xmlrpc.php {
        limit_req zone=login_routes burst=3 nodelay;
        include /etc/nginx/conf.d/generated_xmlrpc_route.conf;
    }

    # wp-cron: restricted to 127.0.0.1 by default (DISABLE_PUBLIC_WP_CRON=true).
    # Override with DISABLE_PUBLIC_WP_CRON=false to allow public access.
    include /etc/nginx/conf.d/generated_wp_cron.conf;

    # REST API: rate-limited separately; cache bypass is handled by $skip_cache_uri map.
    location ^~ /wp-json/ {
        limit_req zone=api_routes burst=100 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # wp-admin PHP files (admin screens, admin-ajax.php, load-scripts.php): bypass cache,
    # apply the protected rate limit.
    location ~* ^/wp-admin/.*\.php$ {
        limit_req zone=protected_routes burst=60 nodelay;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        include /etc/nginx/snippets/wp-fastcgi.conf;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
    }

    # wp-admin non-PHP paths.
    location /wp-admin/ {
        limit_req zone=protected_routes burst=60 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Main public routes.
    location / {
        limit_req zone=normal_routes burst=100 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Customer-injected nginx config (via NGINX_EXTRA_CONF).
    include /etc/nginx/conf.d/generated_extra.conf;

    # PHP handler — FastCGI cache applied here for anonymous GET/HEAD requests.
    location ~ \.php$ {
        limit_req zone=normal_routes burst=100 nodelay;

        try_files $fastcgi_script_name =404;

        include /etc/nginx/snippets/wp-fastcgi.conf;

        fastcgi_cache WORDPRESS;
        include /etc/nginx/conf.d/generated_fastcgi_cache.conf;

        # Let nginx manage cache TTL independently of whatever WordPress sets.
        # The skip-cache maps above protect logged-in/admin/cart/etc.
        fastcgi_ignore_headers Cache-Control Expires;

        # X-Cache header (controlled by DEBUG_HEADERS env var).
        include /etc/nginx/conf.d/generated_debug_headers.conf;
    }
}
