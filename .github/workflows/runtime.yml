# Builds and smoke-tests every PHP track on each PR. Never pushes: releases go through ./push.sh.
name: runtime

on:
  pull_request:

permissions:
  contents: read

jobs:
  revision:
    name: REVISION bumped with BASE_IMAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a track's BASE_IMAGE changed without its REVISION
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          for track in tracks/*.env; do
            diff="$(git diff "origin/${BASE_REF}" -- "$track")"
            if grep -q '^+BASE_IMAGE=' <<<"$diff" && ! grep -q '^+REVISION=' <<<"$diff"; then
              echo "::error file=${track}::BASE_IMAGE changed without a REVISION bump"
              status=1
            fi
          done
          exit "$status"

  smoke:
    name: build + smoke php${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      # The default docker buildx driver loads into the local image store, which the smoke
      # test's git/ build needs to see; do not switch to a docker-container builder.
      - name: Build
        run: ./build.sh "$PHP" | tee build.log
      - name: Smoke test
        run: |
          # shellcheck source=/dev/null
          source "tracks/php${PHP}.env"
          tests/smoke.sh "$(tail -n1 build.log)" "$MIN_PHP_VERSION"
