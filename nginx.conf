# Debian module packages drop their load_module lines here (headers-more, cache-purge).
include /etc/nginx/modules-enabled/*.conf;

user www-data;
# worker_processes is generated from the container's CPU quota (generated_main_overrides.conf).
include /etc/nginx/conf.d/generated_main_overrides.conf;
pid /run/nginx.pid;

# Container logs: both streams go to the platform log viewer; nothing is written to files.
error_log /dev/stderr warn;

# Each in-flight request holds two descriptors (client + FastCGI) for as long as PHP takes to
# answer. The container's soft limit is only 1024; with one worker (the common case) nginx
# failed accept() with "Too many open files" and answered 500 at ~500 queued requests before
# the PHP in-flight cap existed. Descriptors and connection slots are cheap (a few hundred bytes
# each); the memory that matters is in PHP and is bounded by the pool, so these can be generous.
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30s;
    keepalive_requests 1000;

    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # client_max_body_size is set dynamically via MAX_UPLOAD_SIZE (generated_http_overrides.conf).

    client_body_buffer_size 256k;

    reset_timedout_connection on;

    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # Real client IP resolution.
    #
    # With real_ip_recursive on, nginx walks X-Forwarded-For right-to-left, skipping trusted
    # hops, and stops at the first untrusted address — the true client. Trusted hops:
    #   - TRUSTED_PROXY_CIDRS (default: the private ranges Traefik / the k8s LB live in),
    #   - Cloudflare's published edge ranges, baked at build from cloudflare.com/ips-v4|v6.
    # When Cloudflare proxies the site, its (public) edge IPs appear in XFF; without trusting
    # them recursion would stop there and every visitor would share one rate-limit bucket.
    # SECURITY: trusting XFF from public Cloudflare IPs means the origin must only accept
    # connections from Cloudflare (IP allowlist / Authenticated Origin Pulls / Tunnel).
    include /etc/nginx/conf.d/generated_trusted_proxies.conf;
    include /etc/nginx/conf.d/cloudflare_ips.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main_ext
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'xff="$http_x_forwarded_for" realip="$realip_remote_addr" '
        'rt=$request_time uct="$upstream_connect_time" '
        'uht="$upstream_header_time" urt="$upstream_response_time" '
        'cache="$upstream_cache_status"';

    access_log /dev/stdout main_ext;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # The scheme the visitor used. TLS terminates at Traefik, which sets X-Forwarded-Proto.
    map $http_x_forwarded_proto $forwarded_scheme {
        https   https;
        default $scheme;
    }
    map $forwarded_scheme $fastcgi_https {
        https   on;
        default "";
    }
    map $forwarded_scheme $forwarded_port {
        https   443;
        default $server_port;
    }

    # fastcgi_cache_key is generated from CACHE_IGNORE_QUERY_PARAMS at startup.
    include /etc/nginx/conf.d/generated_cache_key.conf;

    # Rate limit zones, cache storage, client_max_body_size and the HSTS map
    # are generated from environment variables at startup.
    include /etc/nginx/conf.d/generated_http_overrides.conf;

    # Connection limit per client IP (RATE_LIMIT_MAX_CONN_PER_IP, applied in default.conf).
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:20m;

    limit_req_status 429;
    limit_conn_status 429;

    # PHP-FPM upstreams, generated at startup: `php_fpm` carries the capacity cap (max_conns sized
    # to the pool: past it nginx answers 503 + Retry-After at once instead of queueing a request
    # that would wait minutes for a worker; cache HITs and static files never touch the upstream,
    # so they keep being served while the pool is saturated) and `php_fpm_internal` is uncapped
    # for the health check and the loopback cron trigger.
    include /etc/nginx/conf.d/generated_upstream.conf;

    # The loopback cron trigger (run.sh) must queue for a worker rather than be shed, whichever
    # wp-cron mode is on; the generated wp-cron location switches its upstream through this map.
    map $remote_addr $cc_loopback_php_upstream {
        default   php_fpm;
        127.0.0.1 php_fpm_internal;
    }

    # WordPress's own "do not cache" signal (nocache_headers(): Cache-Control: no-cache,
    # must-revalidate, max-age=0; also no-store/private from plugins) is honoured as a do-not-store
    # signal, while the TTL still comes from CACHE_TTL_SECONDS (fastcgi_ignore_headers keeps a
    # plugin's max-age from extending it). Anonymous 404s carry it too and are deliberately cached
    # for a minute, so they are exempt.
    map "$upstream_status:$upstream_http_cache_control" $cc_upstream_nocache {
        default 0;
        "~*^(?!404)[0-9]+:.*(no-cache|no-store|private)" 1;
    }

    # Skip cache for unsafe methods.
    map $request_method $skip_cache_method {
        default 0;
        POST    1;
        PUT     1;
        PATCH   1;
        DELETE  1;
    }

    # Skip cache for logged-in users, commenters, carts, checkout sessions, password-protected posts.
    map $http_cookie $skip_cache_cookie {
        default 0;
        ~*wordpress_logged_in        1;
        ~*wordpress_sec              1;
        ~*wp-postpass                1;
        ~*comment_author             1;
        ~*woocommerce_items_in_cart  1;
        ~*woocommerce_cart_hash      1;
        ~*wp_woocommerce_session     1;
        ~*edd_items_in_cart          1;
    }

    # Skip cache for dynamic/protected WordPress routes. Paths are anchored so /cartoons/ or
    # /accounting/ are cached; query params are matched as whole names so ?tags= or ?filters= are too.
    map $request_uri $skip_cache_uri {
        default 0;

        ~*^/wp-admin(/|$)                               1;
        ~*^/wp-login\.php                               1;
        ~*^/wp-cron\.php                                1;
        ~*^/xmlrpc\.php                                 1;
        ~*^/wp-json(/|$)                                1;
        ~*^/index\.php/wp-json(/|$)                     1;
        ~*^/wc-api(/|$)                                 1;

        ~*^/(cart|checkout|my-account|account)(/|\?|$)  1;

        ~*[?&]preview=true                              1;
        ~*[?&]customize_changeset_uuid=                 1;
        ~*[?&]elementor-preview=                        1;
        ~*[?&]wc-ajax=                                  1;
        ~*[?&]add-to-cart=                              1;
        ~*[?&]s=                                        1;

        # The REST API under its other spellings: rest_url() returns /?rest_route=... on sites with
        # plain permalinks (every fresh install), and /index.php/wp-json/... with "almost pretty" ones.
        ~*[?&]rest_route=                               1;
    }

    map "$skip_cache_method$skip_cache_cookie$skip_cache_uri" $skip_cache {
        default 0;
        ~1      1;
    }

    # Never cache an empty-bodied upstream response (e.g. a blank 200 from a
    # failed whole-page output buffer). Keyed on the upstream Content-Length:
    # "0" => empty body => do not store. A chunked response (no Content-Length)
    # can't be judged here and falls through to the normal skip-cache rules.
    # Referenced by fastcgi_no_cache only when CACHE_SKIP_EMPTY is enabled
    # (generated_fastcgi_cache.conf).
    map $upstream_http_content_length $cache_skip_empty {
        "0"     1;
        default 0;
    }

    include /etc/nginx/conf.d/default.conf;

    # Internal metrics server — bound to loopback only, never reachable from outside the pod.
    # Serves nginx stub_status, fpm-ping, fpm-status, and WordPress application metrics.
    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /var/www/html;
        access_log off;

        location = /nginx_status {
            stub_status;
        }

        location = /fpm-ping {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME     /fpm-ping;
            fastcgi_param REQUEST_URI     /fpm-ping;
            fastcgi_pass 127.0.0.1:9000;
        }

        location = /fpm-status {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME     /fpm-status;
            fastcgi_param REQUEST_URI     /fpm-status;
            fastcgi_pass 127.0.0.1:9000;
        }

        location = /wp-metrics {
            include fastcgi_params;
            fastcgi_param HTTP_PROXY      "";
            fastcgi_param SCRIPT_FILENAME /usr/share/wp-runtime/wp-metrics.php;
            fastcgi_param SCRIPT_NAME     /wp-metrics.php;
            fastcgi_param REQUEST_URI     /wp-metrics;
            fastcgi_pass 127.0.0.1:9000;
        }
    }

    # WordPress application metrics for Prometheus on the pod network, next to the two exporters
    # (9113 nginx, 9253 PHP-FPM): the same wp-metrics.php, at /metrics and nothing else. The
    # loopback server above cannot be scraped from outside the pod. root matters: the platform
    # prepend finds wp-config.php through DOCUMENT_ROOT.
    server {
        listen 9254;
        server_name _;
        root /var/www/html;
        access_log off;

        location = /metrics {
            include fastcgi_params;
            fastcgi_param HTTP_PROXY      "";
            fastcgi_param SCRIPT_FILENAME /usr/share/wp-runtime/wp-metrics.php;
            fastcgi_param SCRIPT_NAME     /wp-metrics.php;
            fastcgi_param REQUEST_URI     /metrics;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            return 404;
        }
    }
}
