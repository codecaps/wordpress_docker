# Shared FastCGI parameters for every PHP location. Included after fastcgi_params so the values
# here win: the real client IP, the forwarded scheme and HTTPS (TLS terminates at Traefik, so
# $scheme/$https are always http/empty on this plain listener).
include /etc/nginx/fastcgi_params;
# httpoxy (CVE-2016-5385): a client's "Proxy:" request header would otherwise reach PHP as
# HTTP_PROXY, which some HTTP client libraries take as the proxy for their outbound requests.
fastcgi_param HTTP_PROXY "";
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param SCRIPT_NAME $fastcgi_script_name;
fastcgi_param HTTP_HOST $http_host;
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_param HTTP_X_REAL_IP $remote_addr;
fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_scheme;
fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
fastcgi_param REQUEST_SCHEME $forwarded_scheme;
fastcgi_param SERVER_PORT $forwarded_port;
fastcgi_param HTTPS $fastcgi_https if_not_empty;

# $php_upstream is `php_fpm` (capped, see generated_upstream.conf) unless a loopback-only location
# switched it to `php_fpm_internal`.
fastcgi_pass $php_upstream;
fastcgi_index index.php;
# One connection per request, closed when it ends. With fastcgi_keep_conn a PHP-FPM worker stays
# bound to the kept connection until nginx closes it (60s idle), so with a 3-worker pool any
# concurrency past 3 stalled for a minute and then 504'd (measured on r3: 10 concurrent 3s
# requests -> 3 served in 3s, 3 at 66s, 4 x 504 at 120s; without keep-alive all 10 in 12s).
# A loopback connect per request costs microseconds.

# Timeouts are set in server {} (default.conf) so a location can raise them before this include.

# Large header buffers: logged-in responses (auth cookies re-issued via Set-Cookie + plugin
# headers) overflow nginx's 4k/8k defaults -> "upstream sent too big header" -> 502.
fastcgi_buffering on;
fastcgi_buffer_size 64k;
fastcgi_buffers 16 64k;
fastcgi_busy_buffers_size 128k;
fastcgi_temp_file_write_size 256k;

# The runtime mu-plugin marks responses WordPress declared uncacheable (DONOTCACHEPAGE) with this
# header; nginx acts on it (fastcgi_no_cache in generated_fastcgi_cache.conf) and strips it here.
fastcgi_hide_header X-CC-No-Cache;
